name: flyrank-capstone-image-relevance
title: Image Relevance & Auto-Tagging
subtitle: AI Image Understanding & Content Matching Engine
phase: final_submission
implementation_status: submission_ready

authentication:
  scheme: bearer_api_key
  demo_key_env: DEMO_API_KEY
  request_header: "Authorization: Bearer <DEMO_API_KEY>"
  setup: "Generate a random 256-bit DEMO_API_KEY before run; set NEXT_PUBLIC_API_KEY to the same local-only value for the browser demo. README.md contains the exact PowerShell commands."
  persisted_form: sha256_digest_only
  public_endpoints: [/health, /ready]

run: "docker compose up --build -d"
seed: "docker compose exec -T api python -m scripts.seed"
test: "docker compose exec -T api pytest"
base_url: http://localhost:8000
frontend_url: http://localhost:3000

evaluator_endpoints:
  health:
    method: GET
    path: /health
    status: available
  readiness:
    method: GET
    path: /ready
    status: available
  process_images:
    method: POST
    path: /images/process
    status: available
  job_status:
    method: GET
    path: /jobs/{job_id}
    status: available
  post_recommendations:
    method: POST
    path: /posts/{post_id}/recommendations
    status: available
  recommendation_detail:
    method: GET
    path: /recommendations/{recommendation_id}
    status: available
  approve_recommendation:
    method: POST
    path: /recommendations/{recommendation_id}/approve
    status: available
  reject_recommendation:
    method: POST
    path: /recommendations/{recommendation_id}/reject
    status: available
  run_evaluation:
    method: POST
    path: /evaluation/run
    status: available
  latest_evaluation:
    method: GET
    path: /evaluation/latest
    status: available
