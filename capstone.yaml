name: flyrank-capstone-image-relevance
title: Image Relevance & Auto-Tagging
subtitle: AI Image Understanding & Content Matching Engine
phase: labeled_evaluation
implementation_status: phase_9_complete

# `run` and `test` were verified in Phase 2. Seeding remains planned and must
# not be treated as executable until the corpus workflow exists.
run: "docker compose up --build -d"
seed: "TODO_PHASE_2_PLUS: docker compose exec api python -m scripts.seed"
test: "docker compose exec -T api pytest"
base_url: http://localhost:8000

evaluator_endpoints:
  health:
    method: GET
    path: /health
    status: available
  readiness:
    method: GET
    path: /ready
    status: available
  process_images:
    method: POST
    path: /images/process
    status: planned
  job_status:
    method: GET
    path: /jobs/{job_id}
    status: planned
  post_recommendations:
    method: POST
    path: /posts/{post_id}/recommendations
    status: available
  recommendation_detail:
    method: GET
    path: /recommendations/{recommendation_id}
    status: planned
  approve_recommendation:
    method: POST
    path: /recommendations/{recommendation_id}/approve
    status: planned
  reject_recommendation:
    method: POST
    path: /recommendations/{recommendation_id}/reject
    status: planned
  run_evaluation:
    method: POST
    path: /evaluation/run
    status: available
  latest_evaluation:
    method: GET
    path: /evaluation/latest
    status: available
  ai_usage:
    method: GET
    path: /metrics/ai-usage
    status: planned
