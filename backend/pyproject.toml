[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrank-image-relevance-backend"
version = "0.1.0"
description = "Backend for the FlyRank Image Relevance & Auto-Tagging capstone"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "pgvector>=0.3,<1.0",
  "pillow>=11.1,<12.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sentence-transformers>=3.4,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "starlette>=0.46,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
