services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flyrank}
      POSTGRES_USER: ${POSTGRES_USER:-flyrank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyrank}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flyrank} -d ${POSTGRES_DB:-flyrank}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: imagerelevanceauto-tagging-api
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-FlyRank Image Relevance API}
      APP_ENV: ${APP_ENV:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flyrank}:${POSTGRES_PASSWORD:-flyrank}@db:5432/${POSTGRES_DB:-flyrank}
      IMAGE_STORAGE_ROOT: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      VISION_PROVIDER: ${VISION_PROVIDER:-corpus_fixture}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-30}
      VISION_LOW_CONFIDENCE_THRESHOLD: ${VISION_LOW_CONFIDENCE_THRESHOLD:-0.70}
      VISION_BUDGET_USD: ${VISION_BUDGET_USD:-0.00}
      VISION_ESTIMATED_COST_PER_CALL_USD: ${VISION_ESTIMATED_COST_PER_CALL_USD:-}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      PROCESSING_INITIAL_BACKOFF_SECONDS: ${PROCESSING_INITIAL_BACKOFF_SECONDS:-5}
      PROCESSING_MAX_BACKOFF_SECONDS: ${PROCESSING_MAX_BACKOFF_SECONDS:-300}
      PROCESSING_LEASE_SECONDS: ${PROCESSING_LEASE_SECONDS:-60}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-corpus_fixture}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-c9745ed1d9f207416be6d2e6f8de32d1f16199bf}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-true}
      EVALUATION_DATASET_PATH: /app/data/evaluation.jsonl
      CORPUS_MANIFEST_PATH: /app/data/corpus-manifest.json
      DEMO_API_KEY: ${DEMO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "8000:8000"
    volumes:
      - image_uploads:/app/uploads
      - ./data:/app/data

  worker:
    image: imagerelevanceauto-tagging-api
    command: ["python", "-m", "app.workers.image_processing"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flyrank}:${POSTGRES_PASSWORD:-flyrank}@db:5432/${POSTGRES_DB:-flyrank}
      IMAGE_STORAGE_ROOT: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      VISION_PROVIDER: ${VISION_PROVIDER:-corpus_fixture}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-30}
      VISION_LOW_CONFIDENCE_THRESHOLD: ${VISION_LOW_CONFIDENCE_THRESHOLD:-0.70}
      VISION_BUDGET_USD: ${VISION_BUDGET_USD:-0.00}
      VISION_ESTIMATED_COST_PER_CALL_USD: ${VISION_ESTIMATED_COST_PER_CALL_USD:-}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      PROCESSING_INITIAL_BACKOFF_SECONDS: ${PROCESSING_INITIAL_BACKOFF_SECONDS:-5}
      PROCESSING_MAX_BACKOFF_SECONDS: ${PROCESSING_MAX_BACKOFF_SECONDS:-300}
      PROCESSING_LEASE_SECONDS: ${PROCESSING_LEASE_SECONDS:-60}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-corpus_fixture}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-c9745ed1d9f207416be6d2e6f8de32d1f16199bf}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-true}
      CORPUS_MANIFEST_PATH: /app/data/corpus-manifest.json
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - image_uploads:/app/uploads
      - ./data:/app/data

  frontend:
    image: imagerelevanceauto-tagging-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  image_uploads:
