services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flyrank}
      POSTGRES_USER: ${POSTGRES_USER:-flyrank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyrank}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flyrank} -d ${POSTGRES_DB:-flyrank}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flyrank}:${POSTGRES_PASSWORD:-flyrank}@db:5432/${POSTGRES_DB:-flyrank}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "8000:8000"

volumes:
  postgres_data:

